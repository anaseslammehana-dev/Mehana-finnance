function getCycleFor(dateObj) {
  const d = new Date(dateObj);
  const day = d.getDate();
  let start;
  if (day >= 25) start = new Date(d.getFullYear(), d.getMonth(), 25);
  else start = new Date(d.getFullYear(), d.getMonth() - 1, 25);
  const end = new Date(start.getFullYear(), start.getMonth() + 1, 24);
  return { start, end, key: `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, "0")}` };
}

/* ------------------------- IndexedDB storage layer ------------------------- */
const DB_NAME = "mahanna_finance_db";
const STORE = "kv";
const SCHEMA_VERSION = 1;

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

function emptyDB() {
  return {
    schemaVersion: SCHEMA_VERSION,
    createdAt: new Date().toISOString(),
    setupDone: false,
    settings: { language: "ar", currency: "EGP", pin: null },
    categories: DEFAULT_CATEGORIES,
    paymentMethods: DEFAULT_PAYMENT_METHODS,
    transactions: [],
    visaCards: [],
    car: { name: "", odometer: 0 },
    fuelRecords: [],
    maintenanceRecords: [],
    savingsGoal: { target: 150000 },
    cashBalance: 0,
    recurring: [],
  };
}
async function loadDB() { try { const v = await idbGet("db"); return v || null; } catch (e) { return null; } }
async function saveDB(db) { try { await idbSet("db", db); } catch (e) { console.error("save failed", e); } }

/* ============================== Local voice parser (offline) ============================== */
function parseArabicNumber(str) {
  const map = { "٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9" };
  return str.replace(/[٠-٩]/g, (d) => map[d] || d);
}
function localExtractTransactions(text, categories) {
  const norm = parseArabicNumber(text);
  // split on connectors "و" / "and"
  const parts = norm.split(/\sو(?=\D*\d)|\sand\s/).map(s => s.trim()).filter(Boolean);
  const chunks = parts.length > 1 ? parts : [norm];
  return chunks.map((chunk) => {
    const numMatch = chunk.match(/\d+(\.\d+)?/);
    const amount = numMatch ? parseFloat(numMatch[0]) : null;
    let categoryId = null;
    for (const c of categories) {
      if ((c.keywords || []).some((kw) => chunk.includes(kw))) { categoryId = c.id; break; }
    }
    const paymentMethodId = /فيزا|كارت|card|visa/.test(chunk) ? "visa" : "cash";
    const missing = [];
    if (!amount) missing.push("amount");
    if (!categoryId) missing.push("category");
    return { amount, categoryId, paymentMethodId, note: chunk.trim(), missing };
  });
}

  const [toast, setToast] = useState(null);

  useEffect(() => {
    (async () => {
      let d = await loadDB();
      if (!d) d = emptyDB();
      setDb(d);
      setLocked(!!d.settings.pin);
      setLoaded(true);
    })();
  }, []);

  useEffect(() => { if (loaded && db) saveDB(db); }, [db, loaded]);

  const lang = db && db.settings ? db.settings.language : "ar";
  const t = STR[lang];
  const dir = lang === "ar" ? "rtl" : "ltr";

  const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); }, []);

  if (!loaded) return <div style={sx.centerScreen}><div style={sx.spinner} /></div>;
  if (!db.setupDone) return <FirstRun setDb={setDb} />;
  if (locked) return <PinLock db={db} t={t} lang={lang} onUnlock={() => setLocked(false)} />;

  const cycle = getCycleFor(new Date());

  return (
    <div dir={dir} style={{ ...sx.app, fontFamily: lang === "ar" ? "'Tahoma',sans-serif" : "'Segoe UI',sans-serif" }}>

        <div style={sx.headerTitle}>{t.appName}</div>

        {tab === "visa" && <VisaSection db={db} update={update} t={t} lang={lang} showToast={showToast} />}
        {tab === "savings" && <SavingsSection db={db} t={t} lang={lang} />}
        {tab === "settings" && <SettingsSection db={db} setDb={setDb} update={update} t={t} lang={lang} showToast={showToast} />}
      </main>
      {toast && <div style={sx.toast}>{toast}</div>}
      <div style={sx.fabRow}>
        <button style={{ ...sx.fab, background: "#D64545" }} onClick={() => setShowAddExpense(true)}>− {t.addExpense}</button>
        <button style={sx.fabMic} onClick={() => setShowVoice(true)}>🎙</button>
        <button style={{ ...sx.fab, background: "#2E8B57" }} onClick={() => setShowAddIncome(true)}>+ {t.addIncome}</button>
      </div>
      <nav style={sx.bottomNav}>
        {[["dashboard","🏠",t.dashboard],["transactions","📋",t.transactions],["car","🚗",t.car],["visa","💳",t.visa],["savings","🎯",t.savings],["settings","⚙️",t.settings]].map(([id,icon,label]) => (
          <button key={id} onClick={() => setTab(id)} style={{ ...sx.navBtn, color: tab === id ? "#1F6F5C" : "#8a8f98" }}>
            <div style={{ fontSize: 18 }}>{icon}</div><div style={{ fontSize: 10 }}>{label}</div>
          </button>
        ))}
      </nav>
      {showAddExpense && <TxModal type="expense" db={db} update={update} t={t} lang={lang} onClose={() => setShowAddExpense(false)} showToast={showToast} />}
      {showAddIncome && <TxModal type="income" db={db} update={update} t={t} lang={lang} onClose={() => setShowAddIncome(false)} showToast={showToast} />}

  const [step, setStep] = useState(0);
  const [local, setLocal] = useState({ language: "ar", pin: "", cash: "", salary: "", odometer: "" });
  const T = STR[local.language];
  const dir = local.language === "ar" ? "rtl" : "ltr";

  const finish = () => {
    setDb((prev) => {
      const next = structuredClone(prev);
      next.settings.language = local.language;
      next.settings.pin = local.pin ? local.pin : null;
      next.cashBalance = Number(local.cash) || 0;
      next.car.odometer = Number(local.odometer) || 0;
      if (Number(local.salary) > 0) {
        const cycle = getCycleFor(new Date());
        next.transactions.push({ id: uid(), type: "income", amount: Number(local.salary), source: "salary", date: todayISO(), note: "", cycleKey: cycle.key, createdAt: new Date().toISOString() });
      }
      next.setupDone = true;
      return next;
    });
  };

  return (
    <div dir={dir} style={{ ...sx.app, justifyContent: "center" }}>
      <div style={sx.firstRunCard}>
        <div style={{ fontSize: 40, textAlign: "center", marginBottom: 8 }}>💰</div>
        <h2 style={{ textAlign: "center", margin: "0 0 20px" }}>{T.firstRunTitle}</h2>
        {step === 0 && (<>
          <div style={sx.label}>{T.chooseLang}</div>
          <div style={{ display: "flex", gap: 10 }}>
            <button style={{ ...sx.choiceBtn, ...(local.language === "ar" ? sx.choiceBtnActive : {}) }} onClick={() => setLocal((l) => ({ ...l, language: "ar" }))}>العربية</button>
            <button style={{ ...sx.choiceBtn, ...(local.language === "en" ? sx.choiceBtnActive : {}) }} onClick={() => setLocal((l) => ({ ...l, language: "en" }))}>English</button>
          </div>
        </>)}
        {step === 1 && (<><div style={sx.label}>{T.setPin}</div><input style={sx.input} type="password" maxLength={6} placeholder="••••" value={local.pin} onChange={(e) => setLocal((l) => ({ ...l, pin: e.target.value.replace(/\D/g, "") }))} /></>)}
        {step === 2 && (<><div style={sx.label}>{T.enterCash}</div><input style={sx.input} type="number" placeholder="0" value={local.cash} onChange={(e) => setLocal((l) => ({ ...l, cash: e.target.value }))} /></>)}
        {step === 3 && (<><div style={sx.label}>{T.enterSalary}</div><input style={sx.input} type="number" placeholder="0" value={local.salary} onChange={(e) => setLocal((l) => ({ ...l, salary: e.target.value }))} /></>)}
        {step === 4 && (<>
          <div style={sx.label}>{T.enterOdometer}</div>
          <input style={sx.input} type="number" placeholder="0" value={local.odometer} onChange={(e) => setLocal((l) => ({ ...l, odometer: e.target.value }))} />
          <div style={{ fontSize: 12, color: "#8a8f98", marginTop: 10 }}>{T.savingsGoal}: 150,000 {T.egp}</div>
        </>)}
        <div style={{ display: "flex", gap: 10, marginTop: 24 }}>
          {step > 0 && <button style={sx.secondaryBtn} onClick={() => setStep((s) => s - 1)}>{local.language === "ar" ? "رجوع" : "Back"}</button>}
          {step < 4 ? <button style={sx.primaryBtn} onClick={() => setStep((s) => s + 1)}>{T.skip}</button> : <button style={sx.primaryBtn} onClick={finish}>{T.finish}</button>}
        </div>
      </div>
    </div>
  );
}

/* ============================ DASHBOARD ============================ */
function Dashboard({ db, t, lang, cycle }) {
  const cycleTx = db.transactions.filter((tx) => tx.cycleKey === cycle.key);
  const income = cycleTx.filter((tx) => tx.type === "income").reduce((s, tx) => s + tx.amount, 0);
  const expenses = cycleTx.filter((tx) => tx.type === "expense").reduce((s, tx) => s + tx.amount, 0);
  const remaining = income - expenses;
  const pctSpent = income > 0 ? Math.min(100, (expenses / income) * 100) : 0;
  const now = new Date();
  const totalDays = Math.round((cycle.end - cycle.start) / 86400000) + 1;
  const daysElapsed = Math.max(1, Math.round((now - cycle.start) / 86400000) + 1);
  const daysLeft = Math.max(0, totalDays - daysElapsed);
  const dailyRate = expenses / daysElapsed;
  const expectedEnd = income - (expenses + dailyRate * daysLeft);
  const visaSpend = cycleTx.filter((tx) => tx.type === "expense" && tx.paymentMethodId === "visa").reduce((s, tx) => s + tx.amount, 0);
  const carExp = cycleTx.filter((tx) => tx.categoryId === "fuel" || tx.categoryId === "carMaintenance").reduce((s, tx) => s + tx.amount, 0);
  const catTotals = {};
  cycleTx.filter((tx) => tx.type === "expense").forEach((tx) => { catTotals[tx.categoryId] = (catTotals[tx.categoryId] || 0) + tx.amount; });
  const topCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]).slice(0, 4);
  const catName = (id) => { const c = db.categories.find((c) => c.id === id); return c ? c[lang] : id; };
  const smallTx = cycleTx.filter((tx) => tx.type === "expense" && tx.amount < 100);
  const smallTotal = smallTx.reduce((s, tx) => s + tx.amount, 0);
  const insights = [];
  if (income > 0 && topCats[0]) {
    const pct = ((topCats[0][1] / income) * 100).toFixed(0);
    insights.push(lang === "ar" ? `${catName(topCats[0][0])} استهلكت ${pct}% من دخلك هذه الدورة.` : `${catName(topCats[0][0])} consumed ${pct}% of your income this cycle.`);
  }
  if (smallTotal > 0) insights.push(lang === "ar" ? `صرفت ${fmt(smallTotal)} جنيه على ${smallTx.length} معاملة صغيرة (أقل من 100 جنيه).` : `You spent ${fmt(smallTotal)} EGP on ${smallTx.length} small transactions (below 100 EGP).`);
  if (daysElapsed > 3) insights.push(lang === "ar" ? `متوسط إنفاقك اليومي ${fmt(dailyRate)} جنيه.` : `Your average daily spend is ${fmt(dailyRate)} EGP.`);

  return (
    <div style={{ paddingBottom: 12 }}>
      <div style={sx.cycleCard}>
        <div style={{ fontSize: 13, opacity: 0.85 }}>{t.cycle}</div>
        <div style={{ fontSize: 15, fontWeight: 700, marginTop: 2 }}>{cycle.start.toLocaleDateString(lang === "ar" ? "ar-EG" : "en-GB")} — {cycle.end.toLocaleDateString(lang === "ar" ? "ar-EG" : "en-GB")}</div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 12 }}><span>{t.daysElapsed}: {daysElapsed}</span><span>{t.daysLeft}: {daysLeft}</span></div>
      </div>
      <div style={sx.grid2}>
        <StatCard label={t.income} value={income} color="#2E8B57" />
        <StatCard label={t.expenses} value={expenses} color="#D64545" />
        <StatCard label={t.remaining} value={remaining} color="#1F6F5C" />
        <StatCard label={t.cash} value={db.cashBalance} color="#3B6EA5" />
      </div>
      <div style={sx.card}>
        <div style={sx.cardTitle}>{t.percentSpent}</div>
        <div style={sx.progressTrack}><div style={{ ...sx.progressFill, width: `${pctSpent}%`, background: pctSpent > 90 ? "#D64545" : "#1F6F5C" }} /></div>
        <div style={{ fontSize: 12, color: "#8a8f98", marginTop: 4 }}>{pctSpent.toFixed(0)}%</div>
      </div>
      <div style={sx.card}>
        <div style={sx.cardTitle}>{t.expectedEnd} <span style={{ fontSize: 11, color: "#8a8f98" }}>({t.estimate})</span></div>
        {daysElapsed < 2 ? <div style={{ fontSize: 13, color: "#8a8f98" }}>{t.insufficientData}</div> : <div style={{ fontSize: 22, fontWeight: 800, color: expectedEnd >= 0 ? "#1F6F5C" : "#D64545" }}>{fmt(expectedEnd)} {t.egp}</div>}
      </div>
      <div style={sx.grid2}>
        <StatCard label={t.visaSpend} value={visaSpend} color="#7A4EAB" small />
        <StatCard label={t.carExpenses} value={carExp} color="#B5772C" small />
      </div>
      {topCats.length > 0 && (
        <div style={sx.card}>
          <div style={sx.cardTitle}>{t.topCategories}</div>
          {topCats.map(([id, amt]) => (<div key={id} style={sx.rowBetween}><span>{catName(id)}</span><span style={{ fontWeight: 700 }}>{fmt(amt)} {t.egp}</span></div>))}
        </div>
      )}
      {insights.length > 0 && (
        <div style={{ ...sx.card, background: "#EAF6F1" }}>
          <div style={sx.cardTitle}>🧠 {t.insights}</div>
          {insights.map((s, i) => <div key={i} style={{ fontSize: 13, marginTop: 6, lineHeight: 1.6 }}>• {s}</div>)}
        </div>
      )}
      {cycleTx.length === 0 && <div style={sx.emptyState}>{t.noData}</div>}
    </div>
  );
}

function StatCard({ label, value, color, small }) {
  return (<div style={{ ...sx.card, margin: 0 }}><div style={{ fontSize: 11, color: "#8a8f98" }}>{label}</div><div style={{ fontSize: small ? 16 : 20, fontWeight: 800, color, marginTop: 4 }}>{fmt(value)}</div></div>);
}

    .filter((tx) => { if (!q) return true; const s = `${tx.note || ""} ${catName(tx.categoryId || "")} ${tx.source || ""}`.toLowerCase(); return s.includes(q.toLowerCase()); })
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  const del = (id) => update((n) => { n.transactions = n.transactions.filter((tx) => tx.id !== id); });

    <div>
      <input style={sx.input} placeholder={t.search} value={q} onChange={(e) => setQ(e.target.value)} />

        {["all","expense","income","transfer","visaPayment"].map((ft) => (
          <button key={ft} onClick={() => setFilterType(ft)} style={{ ...sx.chip, ...(filterType === ft ? sx.chipActive : {}) }}>

          </button>
        ))}
      </div>
      {list.length === 0 && <div style={sx.emptyState}>{t.noData}</div>}
      {list.map((tx) => (
        <div key={tx.id} style={sx.txRow}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 14 }}>{tx.type === "income" ? (tx.source ? t[tx.source] || tx.source : t.income) : catName(tx.categoryId)}</div>
            <div style={{ fontSize: 11, color: "#8a8f98" }}>{tx.date} {tx.paymentMethodId ? "· " + pmName(tx.paymentMethodId) : ""} {tx.note ? "· " + tx.note : ""}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ fontWeight: 800, color: tx.type === "income" ? "#2E8B57" : tx.type === "expense" ? "#D64545" : "#3B6EA5" }}>{tx.type === "income" ? "+" : tx.type === "expense" ? "−" : ""}{fmt(tx.amount)}</div>
            <button onClick={() => del(tx.id)} style={sx.iconBtn}>🗑</button>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ============================ TX MODAL ============================ */
function TxModal({ type, db, update, t, lang, onClose, showToast }) {
  const [amount, setAmount] = useState("");
  const [categoryId, setCategoryId] = useState(db.categories[0].id);
  const [subId, setSubId] = useState("");
  const [paymentMethodId, setPaymentMethodId] = useState("cash");
  const [source, setSource] = useState("salary");
  const [date, setDate] = useState(todayISO());
  const [note, setNote] = useState("");
  const cat = db.categories.find((c) => c.id === categoryId);
  const incomeSources = ["salary","bonus","commission","sideIncome","gift","refund","other"];

  const submit = () => {
    const amt = Number(amount);
    if (!amt || amt <= 0) { showToast(lang === "ar" ? "أدخل مبلغ صحيح" : "Enter a valid amount"); return; }
    const cycle = getCycleFor(new Date(date));
    update((n) => {
      if (type === "expense") {
        n.transactions.push({ id: uid(), type: "expense", amount: amt, categoryId, subId: subId || null, date, paymentMethodId, note, cycleKey: cycle.key, createdAt: new Date().toISOString() });
        if (paymentMethodId === "cash") n.cashBalance -= amt;
      } else {
        n.transactions.push({ id: uid(), type: "income", amount: amt, source, date, note, cycleKey: cycle.key, createdAt: new Date().toISOString() });
      }
    });
    showToast(lang === "ar" ? "تم الحفظ" : "Saved");
    onClose();
  };

  return (
    <div style={sx.overlay} onClick={onClose}>
      <div style={sx.sheet} onClick={(e) => e.stopPropagation()}>
        <div style={sx.sheetHeader}>{type === "expense" ? t.addExpense : t.addIncome}</div>
        <div style={sx.label}>{t.amount}</div>
        <input style={sx.input} type="number" autoFocus value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" />
        {type === "expense" ? (<>
          <div style={sx.label}>{t.category}</div>
          <select style={sx.input} value={categoryId} onChange={(e) => { setCategoryId(e.target.value); setSubId(""); }}>
            {db.categories.map((c) => <option key={c.id} value={c.id}>{c[lang]}</option>)}
          </select>
          {cat && cat.subs && cat.subs.length > 0 && (<>
            <div style={sx.label}>{t.subcategory}</div>
            <select style={sx.input} value={subId} onChange={(e) => setSubId(e.target.value)}>
              <option value="">{t.noneOption}</option>
              {cat.subs.map((s) => <option key={s.id} value={s.id}>{s[lang]}</option>)}
            </select>
          </>)}
          <div style={sx.label}>{t.paymentMethod}</div>
          <select style={sx.input} value={paymentMethodId} onChange={(e) => setPaymentMethodId(e.target.value)}>
            {db.paymentMethods.map((p) => <option key={p.id} value={p.id}>{p[lang]}</option>)}
            {db.visaCards.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </>) : (<>
          <div style={sx.label}>{t.source}</div>
          <select style={sx.input} value={source} onChange={(e) => setSource(e.target.value)}>
            {incomeSources.map((s) => <option key={s} value={s}>{t[s]}</option>)}
          </select>
        </>)}
        <div style={sx.label}>{t.date}</div>
        <input style={sx.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        <div style={sx.label}>{t.note}</div>
        <input style={sx.input} value={note} onChange={(e) => setNote(e.target.value)} placeholder={t.notesPlaceholder} />
        <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
          <button style={sx.secondaryBtn} onClick={onClose}>{t.cancel}</button>
          <button style={sx.primaryBtn} onClick={submit}>{t.save}</button>
        </div>
      </div>
    </div>
  );
}

/* ============================ VOICE MODAL (offline local parser) ============================ */
function VoiceModal({ db, update, t, lang, onClose, showToast }) {
  const [status, setStatus] = useState("idle");
  const [transcript, setTranscript] = useState("");
  const [drafts, setDrafts] = useState([]);
  const catList = db.categories;

  const startListening = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast(t.noVoiceSupport); return; }
    const rec = new SR();
    rec.lang = lang === "ar" ? "ar-EG" : "en-US";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onstart = () => setStatus("listening");
    rec.onresult = (e) => { const text = e.results[0][0].transcript; setTranscript(text); process(text); };
    rec.onerror = () => setStatus("idle");
    rec.onend = () => {};
    rec.start();
  };

  const process = (text) => {
    setStatus("processing");
    setTimeout(() => {
      const extracted = localExtractTransactions(text, catList).map((d) => ({ ...d, id: uid(), date: todayISO() }));
      setDrafts(extracted);
      setStatus("review");
    }, 400);
  };

  const updateDraft = (id, patch) => setDrafts((ds) => ds.map((d) => (d.id === id ? { ...d, ...patch } : d)));
  const removeDraft = (id) => setDrafts((ds) => ds.filter((d) => d.id !== id));

  const confirmAll = () => {
    const cycle = getCycleFor(new Date());
    update((n) => {
      drafts.forEach((d) => {
        if (!d.amount || !d.categoryId) return;
        n.transactions.push({ id: uid(), type: "expense", amount: Number(d.amount), categoryId: d.categoryId, subId: null, date: d.date, paymentMethodId: d.paymentMethodId || "cash", note: d.note || "", cycleKey: cycle.key, createdAt: new Date().toISOString() });
        if ((d.paymentMethodId || "cash") === "cash") n.cashBalance -= Number(d.amount);
      });
    });
    showToast(lang === "ar" ? "تم إضافة الحركات" : "Transactions added");
    onClose();
  };

  return (
    <div style={sx.overlay} onClick={onClose}>
      <div style={sx.sheet} onClick={(e) => e.stopPropagation()}>
        <div style={sx.sheetHeader}>{t.voice}</div>
        <div style={{ fontSize: 11, color: "#8a8f98", marginBottom: 8 }}>{t.voiceLocalNote}</div>
        {status === "idle" && (<div style={{ textAlign: "center", padding: "20px 0" }}><button style={sx.micBig} onClick={startListening}>🎙</button><div style={{ fontSize: 13, color: "#8a8f98", marginTop: 12 }}>{t.speakNow}</div></div>)}
        {status === "listening" && (<div style={{ textAlign: "center", padding: "30px 0" }}><div style={sx.pulseDot} /><div style={{ marginTop: 10 }}>{t.listening}</div></div>)}
        {status === "processing" && (<div style={{ textAlign: "center", padding: "30px 0" }}><div style={sx.spinner} /><div style={{ marginTop: 10 }}>{t.processing}</div></div>)}
        {status === "review" && (
          <div>
            {transcript && <div style={{ fontSize: 12, color: "#8a8f98", marginBottom: 10, fontStyle: "italic" }}>"{transcript}"</div>}
            <div style={{ fontWeight: 700, marginBottom: 8 }}>{t.detected}</div>
            {drafts.map((d) => (
              <div key={d.id} style={sx.draftCard}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <input style={{ ...sx.input, width: 100 }} type="number" placeholder={t.amount} value={d.amount || ""} onChange={(e) => updateDraft(d.id, { amount: e.target.value })} />
                  <button onClick={() => removeDraft(d.id)} style={sx.iconBtn}>✕</button>
                </div>
                <select style={sx.input} value={d.categoryId || ""} onChange={(e) => updateDraft(d.id, { categoryId: e.target.value })}>
                  <option value="">{t.category}...</option>
                  {catList.map((c) => <option key={c.id} value={c.id}>{c[lang]}</option>)}
                </select>
                <select style={sx.input} value={d.paymentMethodId || "cash"} onChange={(e) => updateDraft(d.id, { paymentMethodId: e.target.value })}>
                  <option value="cash">{t.cash}</option>
                  <option value="visa">{t.visa}</option>
                </select>
                <input style={sx.input} value={d.note || ""} placeholder={t.note} onChange={(e) => updateDraft(d.id, { note: e.target.value })} />
                {d.missing && d.missing.length > 0 && <div style={{ fontSize: 11, color: "#B5772C", marginTop: 4 }}>⚠ {t.needMoreInfo}: {d.missing.join(", ")}</div>}
              </div>
            ))}
            <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
              <button style={sx.secondaryBtn} onClick={onClose}>{t.cancel}</button>
              <button style={sx.primaryBtn} onClick={confirmAll}>{t.confirm}</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================ CAR SECTION ============================ */
function CarSection({ db, update, t, lang, cycle, showToast }) {
  const [subtab, setSubtab] = useState("fuel");
  const [showFuelForm, setShowFuelForm] = useState(false);
  const [showMaintForm, setShowMaintForm] = useState(false);
  const fuel = [...db.fuelRecords].sort((a, b) => new Date(b.date) - new Date(a.date));
  const maint = [...db.maintenanceRecords].sort((a, b) => new Date(b.date) - new Date(a.date));
  const fuelAsc = [...db.fuelRecords].sort((a, b) => a.odometer - b.odometer);
  let avgConsumption = null;
  const fullTanks = fuelAsc.filter((f) => f.fullTank);
  if (fullTanks.length >= 2) {
    const first = fullTanks[0], last = fullTanks[fullTanks.length - 1];
    const totalKm = last.odometer - first.odometer;
    const totalLiters = fullTanks.slice(1).reduce((s, f) => s + f.liters, 0);
    if (totalKm > 0 && totalLiters > 0) avgConsumption = totalKm / totalLiters;
  }
  const cycleFuelCost = db.fuelRecords.filter((f) => getCycleFor(new Date(f.date)).key === cycle.key).reduce((s, f) => s + f.total, 0);
  const cycleMaintCost = db.maintenanceRecords.filter((m) => getCycleFor(new Date(m.date)).key === cycle.key).reduce((s, m) => s + m.cost, 0);
  const delFuel = (id) => update((n) => { n.fuelRecords = n.fuelRecords.filter((f) => f.id !== id); });
  const delMaint = (id) => update((n) => { n.maintenanceRecords = n.maintenanceRecords.filter((m) => m.id !== id); });

  return (
    <div>
      <div style={sx.card}>
        <div style={sx.cardTitle}>{t.carInfo}</div>
        <div style={sx.rowBetween}><span>{t.odometer}</span><span style={{ fontWeight: 700 }}>{fmt(db.car.odometer)} km</span></div>
        {avgConsumption && <div style={sx.rowBetween}><span>{t.kmPerLiter}</span><span style={{ fontWeight: 700 }}>{avgConsumption.toFixed(1)}</span></div>}
      </div>
      <div style={sx.grid2}>

function FuelForm({ db, update, t, lang, onClose, showToast }) {
  const [liters, setLiters] = useState("");
  const [price, setPrice] = useState("");
  const [odometer, setOdometer] = useState(db.car.odometer || "");
  const [date, setDate] = useState(todayISO());
  const [fullTank, setFullTank] = useState(true);
  const [paymentMethodId, setPaymentMethodId] = useState("cash");
  const total = (Number(liters) || 0) * (Number(price) || 0);
  const submit = () => {
    if (!liters || !price || !odometer) { showToast(lang === "ar" ? "أكمل البيانات" : "Fill required fields"); return; }
    const cycle = getCycleFor(new Date(date));
    update((n) => {
      n.fuelRecords.push({ id: uid(), date, liters: Number(liters), pricePerLiter: Number(price), total, odometer: Number(odometer), fullTank, paymentMethodId, note: "" });
      n.car.odometer = Math.max(n.car.odometer, Number(odometer));
      n.transactions.push({ id: uid(), type: "expense", amount: total, categoryId: "fuel", subId: null, date, paymentMethodId, note: "", cycleKey: cycle.key, createdAt: new Date().toISOString() });
      if (paymentMethodId === "cash") n.cashBalance -= total;
    });
    onClose();
  };
  return (
    <div style={sx.overlay} onClick={onClose}>
      <div style={sx.sheet} onClick={(e) => e.stopPropagation()}>
        <div style={sx.sheetHeader}>{t.fuelHistory}</div>
        <div style={sx.label}>{t.liters}</div><input style={sx.input} type="number" value={liters} onChange={(e) => setLiters(e.target.value)} />
        <div style={sx.label}>{t.pricePerLiter}</div><input style={sx.input} type="number" value={price} onChange={(e) => setPrice(e.target.value)} />
        <div style={sx.label}>{t.totalCost}: {fmt(total)} {t.egp}</div>
        <div style={sx.label}>{t.odometer}</div><input style={sx.input} type="number" value={odometer} onChange={(e) => setOdometer(e.target.value)} />
        <div style={sx.label}>{t.date}</div><input style={sx.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <button style={{ ...sx.chip, ...(fullTank ? sx.chipActive : {}) }} onClick={() => setFullTank(true)}>{t.fullTank}</button>
          <button style={{ ...sx.chip, ...(!fullTank ? sx.chipActive : {}) }} onClick={() => setFullTank(false)}>{t.partialFill}</button>
        </div>
        <div style={sx.label}>{t.paymentMethod}</div>
        <select style={sx.input} value={paymentMethodId} onChange={(e) => setPaymentMethodId(e.target.value)}>{db.paymentMethods.map((p) => <option key={p.id} value={p.id}>{p[lang]}</option>)}</select>
        <div style={{ display: "flex", gap: 10, marginTop: 16 }}><button style={sx.secondaryBtn} onClick={onClose}>{t.cancel}</button><button style={sx.primaryBtn} onClick={submit}>{t.save}</button></div>
      </div>
    </div>
  );
}

/* ============================ VISA SECTION ============================ */
function VisaSection({ db, update, t, lang, showToast }) {
  const [showAdd, setShowAdd] = useState(false);
  const [newCard, setNewCard] = useState("");
  const [payAmount, setPayAmount] = useState("");
  const visaExpenses = db.transactions.filter((tx) => tx.type === "expense" && tx.paymentMethodId === "visa");
  const totalSpend = visaExpenses.reduce((s, tx) => s + tx.amount, 0);
  const payments = db.transactions.filter((tx) => tx.type === "visaPayment");
  const totalPayments = payments.reduce((s, tx) => s + tx.amount, 0);
  const balance = totalSpend - totalPayments;
  const addCard = () => { if (!newCard.trim()) return; update((n) => { n.visaCards.push({ id: uid(), name: newCard.trim(), createdAt: new Date().toISOString() }); }); setNewCard(""); setShowAdd(false); };
  const submitPayment = () => {
    const amt = Number(payAmount);
    if (!amt || amt <= 0) return;
    update((n) => { n.transactions.push({ id: uid(), type: "visaPayment", amount: amt, date: todayISO(), note: "", cycleKey: getCycleFor(new Date()).key, createdAt: new Date().toISOString() }); n.cashBalance -= amt; });
    setPayAmount(""); showToast(lang === "ar" ? "تم تسجيل السداد" : "Payment recorded");
  };
  return (
    <div>
      <div style={sx.card}>
        <div style={sx.cardTitle}>💳 {t.visa}</div>
        <div style={sx.rowBetween}><span>{t.totalSpend}</span><span style={{ fontWeight: 700, color: "#D64545" }}>{fmt(totalSpend)}</span></div>
        <div style={sx.rowBetween}><span>{t.totalPayments}</span><span style={{ fontWeight: 700, color: "#2E8B57" }}>{fmt(totalPayments)}</span></div>
        <div style={sx.rowBetween}><span>{t.currentBalance}</span><span style={{ fontWeight: 800 }}>{fmt(balance)}</span></div>
      </div>
      <div style={sx.card}>
        <div style={sx.cardTitle}>{t.payment}</div>
        <input style={sx.input} type="number" placeholder={t.amount} value={payAmount} onChange={(e) => setPayAmount(e.target.value)} />
        <button style={{ ...sx.primaryBtn, marginTop: 8 }} onClick={submitPayment}>{t.save}</button>
      </div>
      <div style={sx.card}>
        <div style={sx.cardTitle}>{t.visaCards}</div>
        {db.visaCards.map((c) => <div key={c.id} style={sx.rowBetween}><span>{c.name}</span></div>)}
        {showAdd ? (<div style={{ display: "flex", gap: 8, marginTop: 8 }}><input style={sx.input} placeholder={t.cardName} value={newCard} onChange={(e) => setNewCard(e.target.value)} /><button style={sx.primaryBtn} onClick={addCard}>{t.addNew}</button></div>) : (<button style={{ ...sx.secondaryBtn, marginTop: 8 }} onClick={() => setShowAdd(true)}>+ {t.addNew}</button>)}
      </div>
      <div style={sx.card}>
        <div style={sx.cardTitle}>{t.transactions}</div>
        {visaExpenses.length === 0 && <div style={sx.emptyState}>{t.noData}</div>}
        {visaExpenses.slice(0, 15).map((tx) => (<div key={tx.id} style={sx.rowBetween}><span style={{ fontSize: 13 }}>{tx.date} · {tx.note}</span><span style={{ fontWeight: 700 }}>{fmt(tx.amount)}</span></div>))}
      </div>
    </div>
  );
}

/* ============================ SAVINGS ============================ */
function SavingsSection({ db, t, lang }) {
  const totalIncome = db.transactions.filter((tx) => tx.type === "income").reduce((s, tx) => s + tx.amount, 0);
  const totalExpense = db.transactions.filter((tx) => tx.type === "expense").reduce((s, tx) => s + tx.amount, 0);
  const current = totalIncome - totalExpense;
  const goal = db.savingsGoal.target;
  const pct = Math.min(100, Math.max(0, (current / goal) * 100));
  const cycleKeys = [...new Set(db.transactions.map((tx) => tx.cycleKey))];
  let estMonths = null;
  if (cycleKeys.length >= 2) {
    const netByCycle = cycleKeys.map((k) => {
      const inc = db.transactions.filter((tx) => tx.cycleKey === k && tx.type === "income").reduce((s, tx) => s + tx.amount, 0);
      const exp = db.transactions.filter((tx) => tx.cycleKey === k && tx.type === "expense").reduce((s, tx) => s + tx.amount, 0);
      return inc - exp;
    });
    const avgNet = netByCycle.reduce((s, v) => s + v, 0) / netByCycle.length;
    if (avgNet > 0) estMonths = Math.ceil((goal - current) / avgNet);
  }
  return (
    <div>
      <div style={{ ...sx.card, textAlign: "center", padding: 24 }}>
        <div style={{ fontSize: 40 }}>🎯</div>
        <div style={{ fontSize: 13, color: "#8a8f98", marginTop: 6 }}>{t.savingsGoal}</div>
        <div style={{ fontSize: 26, fontWeight: 800, marginTop: 4 }}>{fmt(goal)} {t.egp}</div>
        <div style={sx.progressTrack}><div style={{ ...sx.progressFill, width: `${pct}%` }} /></div>
        <div style={{ fontSize: 13, marginTop: 8 }}>{fmt(current)} / {fmt(goal)} ({pct.toFixed(1)}%)</div>
      </div>
      <div style={sx.card}>
        <div style={sx.cardTitle}>{t.estMonths} <span style={{ fontSize: 11, color: "#8a8f98" }}>({t.estimate})</span></div>
        {estMonths !== null ? (<div style={{ fontSize: 15 }}>{lang === "ar" ? `قد تصل للهدف خلال ${estMonths} شهر تقريبًا` : `You may reach your goal in ~${estMonths} months`}</div>) : <div style={{ fontSize: 13, color: "#8a8f98" }}>{t.insufficientData}</div>}
      </div>
    </div>
  );
}

/* ============================ SETTINGS ============================ */
function SettingsSection({ db, setDb, update, t, lang, showToast }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [restorePreview, setRestorePreview] = useState(null);
  const fileInputRef = useRef(null);

  const doBackup = () => {
    const payload = { ...db, exportedAt: new Date().toISOString(), appVersion: "1.0.0" };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `mahanna-finance-backup-${todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
    showToast(t.backupSuccess);
  };
  const doExportCSV = (rows, filename, headers) => {
    const csv = [headers.join(","), ...rows.map((r) => headers.map((h) => `"${(r[h] ?? "").toString().replace(/"/g, '""')}"`).join(","))].join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  };
  const onFilePicked = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed.schemaVersion || !Array.isArray(parsed.transactions)) throw new Error("invalid");
        setRestorePreview(parsed);
      } catch (err) { showToast(lang === "ar" ? "ملف نسخة احتياطية غير صالح" : "Invalid backup file"); }
    };
    reader.readAsText(file);
  };
  const confirmRestore = () => { setDb(restorePreview); setRestorePreview(null); showToast(lang === "ar" ? "تم الاستعادة" : "Restored"); };
  const deleteAll = () => { setDb(emptyDB()); setConfirmDelete(false); };
  const setLang = (l) => update((n) => { n.settings.language = l; });

  return (
    <div>
      <div style={sx.card}>
        <div style={sx.cardTitle}>{t.language}</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button style={{ ...sx.chip, ...(lang === "ar" ? sx.chipActive : {}) }} onClick={() => setLang("ar")}>العربية</button>
          <button style={{ ...sx.chip, ...(lang === "en" ? sx.chipActive : {}) }} onClick={() => setLang("en")}>English</button>
        </div>
      </div>
      <div style={{ ...sx.card, background: "#FFF7E6" }}><div style={{ fontSize: 12, lineHeight: 1.7 }}>ℹ️ {t.dataStoredLocally}</div></div>
      <div style={sx.card}>
        <div style={sx.cardTitle}>{t.settingsBackup}</div>
        <button style={sx.primaryBtn} onClick={doBackup}>💾 {t.backupNow}</button>
        <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={onFilePicked} />
        <button style={{ ...sx.secondaryBtn, marginTop: 8 }} onClick={() => fileInputRef.current.click()}>📤 {t.restoreBackup}</button>
      </div>
      <div style={sx.card}>
        <div style={sx.cardTitle}>{t.exportData}</div>
        <button style={{ ...sx.secondaryBtn, marginBottom: 6 }} onClick={() => doExportCSV(db.transactions.filter((tx) => tx.type === "expense"), "expenses.csv", ["date","amount","categoryId","paymentMethodId","note"])}>{t.expenses} CSV</button>
        <button style={{ ...sx.secondaryBtn, marginBottom: 6 }} onClick={() => doExportCSV(db.transactions.filter((tx) => tx.type === "income"), "income.csv", ["date","amount","source","note"])}>{t.income} CSV</button>
        <button style={{ ...sx.secondaryBtn, marginBottom: 6 }} onClick={() => doExportCSV(db.fuelRecords, "fuel.csv", ["date","liters","pricePerLiter","total","odometer"])}>{t.fuelHistory} CSV</button>
        <button style={sx.secondaryBtn} onClick={() => doExportCSV(db.maintenanceRecords, "maintenance.csv", ["date","type","cost","odometer"])}>{t.maintenance} CSV</button>
      </div>
      <div style={sx.card}><div style={sx.cardTitle}>{t.categories}</div>{db.categories.map((c) => <div key={c.id} style={sx.rowBetween}><span>{c[lang]}</span></div>)}</div>
      <div style={{ ...sx.card, borderColor: "#D64545" }}>
        <div style={{ ...sx.cardTitle, color: "#D64545" }}>{t.deleteAll}</div>
        {!confirmDelete ? (<button style={{ ...sx.secondaryBtn, color: "#D64545", borderColor: "#D64545" }} onClick={() => setConfirmDelete(true)}>{t.deleteAll}</button>) : (
          <div>
            <div style={{ fontSize: 13, marginBottom: 8 }}>{t.warning}: {lang === "ar" ? "سيتم حذف كل بياناتك نهائيًا. هل أنت متأكد؟" : "This will permanently delete all your data. Are you sure?"}</div>
            <div style={{ display: "flex", gap: 8 }}><button style={sx.secondaryBtn} onClick={() => setConfirmDelete(false)}>{t.cancel}</button><button style={{ ...sx.primaryBtn, background: "#D64545" }} onClick={deleteAll}>{t.confirm}</button></div>
          </div>
        )}
      </div>
      <div style={{ ...sx.card, textAlign: "center", fontSize: 12, color: "#8a8f98" }}>{t.appName} · v1.0.0</div>
      {restorePreview && (
        <div style={sx.overlay}>
          <div style={sx.sheet}>
            <div style={sx.sheetHeader}>{t.warning}</div>
            <div style={{ fontSize: 13, marginBottom: 10 }}>{t.restoreWarning}</div>
            <div style={{ fontSize: 12, color: "#8a8f98", marginBottom: 10 }}>{lang === "ar" ? "تاريخ الإنشاء" : "Created"}: {restorePreview.createdAt} · {lang === "ar" ? "عدد الحركات" : "Transactions"}: {restorePreview.transactions.length}</div>
            <button style={{ ...sx.secondaryBtn, marginBottom: 8 }} onClick={doBackup}>💾 {t.backupBeforeRestore}</button>
            <div style={{ display: "flex", gap: 10 }}><button style={sx.secondaryBtn} onClick={() => setRestorePreview(null)}>{t.cancel}</button><button style={{ ...sx.primaryBtn, background: "#D64545" }} onClick={confirmRestore}>{t.proceed}</button></div>
          </div>
        </div>
      )}
    </div>
  );
}
